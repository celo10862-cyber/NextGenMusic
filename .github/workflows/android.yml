name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug
        run: ./gradlew assembleDebug     
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: next-gen-music-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release build
    if: github.event_name != 'pull_request'
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Generate Auto Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS || 'nextgenkey' }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'autoGeneratedPass123' }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'autoGeneratedPass123' }}" \
            -dname "CN=NextGenMusic, OU=Dev, O=NextGenMusic, L=City, ST=State, C=US"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew     

      - name: Build signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'autoGeneratedPass123' }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nextgenkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'autoGeneratedPass123' }}
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: next-gen-music-release
          path: app/build/outputs/apk/release/*.apk
          
