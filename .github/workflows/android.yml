name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    name: Debug build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Build debug
        run: chmod +x ./gradlew assembleDebug     
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: next-gen-music-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release build
    if: github.event_name != 'pull_request'
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "ANDROID_KEYSTORE_BASE64 is required for release builds"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
      - name: Build signed release
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_STORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is required"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is required"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is required"; exit 1; }
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: next-gen-music-release
          path: app/build/outputs/apk/release/*.apk
