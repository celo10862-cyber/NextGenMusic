name: Android CI & Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    name: Debug build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build debug
        run: ./gradlew assembleDebug     
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: next-gen-music-debug
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release build & GitHub Release
    if: github.event_name != 'pull_request'
    needs: debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      # Downloads the Debug APK built in the 'debug' job
      - uses: actions/download-artifact@v4
        with:
          name: next-gen-music-debug
          path: app/build/outputs/apk/debug/

      - name: Generate Auto Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS || 'nextgenkey' }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'autoGeneratedPass123' }}" \
            -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'autoGeneratedPass123' }}" \
            -dname "CN=NextGenMusic, OU=Dev, O=NextGenMusic, L=City, ST=State, C=US"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew     

      - name: Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'autoGeneratedPass123' }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nextgenkey' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'autoGeneratedPass123' }}
        run: ./gradlew assembleRelease

      # Publishes GitHub Release with auto-generated Changelog & attached APKs (Debug + Release)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
